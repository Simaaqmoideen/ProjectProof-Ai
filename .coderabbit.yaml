# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: 2
language: "en"
tone_instructions: "Review for architectural integrity, security, error handling, and test completeness across FastAPI and React."
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
chat:
  auto_reply: true
