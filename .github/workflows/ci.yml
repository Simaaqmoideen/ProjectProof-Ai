name: ci
on: [pull_request, push]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: projectproof }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client libpango-1.0-0 libpangoft2-1.0-0
      - name: Initialize database schema
        run: psql postgresql://postgres:postgres@localhost:5432/projectproof -f schema.sql
      - name: Install Python dependencies
        run: pip install -e "backend[dev]"
      - name: Lint backend
        run: cd backend && ruff check .
      - name: Run backend tests
        run: cd backend && pytest --tb=short -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && npm install && npm run build
