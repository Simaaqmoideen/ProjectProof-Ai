  <path d="M240 215H300" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M450 215H510" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M660 215H720" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M870 215H930" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <path d="M165 260V330C165 350 180 365 200 365H1000C1020 365 1035 350 1035 330V260" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="10 10"/>

  <rect x="260" y="390" width="680" height="170" rx="18" fill="#111827"/>
  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Outcome</text>
  <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E5E7EB">Verified project history • recruiter confidence • portfolio proof • certificate with QR</text>
