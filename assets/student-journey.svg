<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <rect x="40" y="40" width="1120" height="620" rx="24" fill="white" stroke="#DDE7F2" stroke-width="2"/>

  <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">Student Journey</text>

  <g>
    <rect x="90" y="170" width="150" height="90" rx="16" fill="#E0E7FF"/>
    <text x="165" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#111827">1. Discover</text>
    <text x="165" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#374151">Browse projects</text>
  </g>

  <g>
    <rect x="300" y="170" width="150" height="90" rx="16" fill="#DCFCE7"/>
    <text x="375" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#111827">2. Apply</text>
    <text x="375" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#374151">Submit interest</text>
  </g>

  <g>
    <rect x="510" y="170" width="150" height="90" rx="16" fill="#FEF3C7"/>
